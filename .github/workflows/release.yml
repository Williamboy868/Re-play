name: 'Release Re-play'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true
        default: 'v1.1.0'
jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf zip

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Extension Zip (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -Force builds
          Compress-Archive -Path "extension\*" -DestinationPath "builds\re-play-extension.zip" -Force

      - name: Build Extension Zip (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p builds
          cd extension
          zip -r ../builds/re-play-extension.zip *
          cd ..

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: 'Re-play Downloader ${{ inputs.version || github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          tauriScript: bun run tauri

      - name: Upload Extension Zip to Release
        if: matrix.platform == 'ubuntu-22.04' # Only upload it once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.version || github.ref_name }} builds/re-play-extension.zip --clobber
